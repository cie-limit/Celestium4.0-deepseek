<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CELESTIUM GA Lab v11 — Adaptive</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:monospace; }
body { background:#050505; color:#ccc; padding:12px; font-size:12px; }
h1 { color:#0ff; font-size:15px; margin-bottom:6px; letter-spacing:2px; }
h2 { color:#0f0; font-size:12px; margin:12px 0 4px; border-bottom:1px solid #333; padding-bottom:3px; }
.grid { display:grid; grid-template-columns: 340px 1fr; gap:12px; }
.card { background:#111; border:1px solid #333; padding:8px; border-radius:4px; margin-bottom:8px; }
.row { display:flex; justify-content:space-between; padding:2px 0; }
.row span:last-child { color:#ff0; font-weight:bold; }
button { background:#003; border:1px solid #0ff; color:#0ff; padding:6px 10px; cursor:pointer; font-family:monospace; font-size:11px; margin:2px; }
button:hover { background:#0ff; color:#000; }
button.danger { border-color:#f55; color:#f55; }
button.danger:hover { background:#f55; color:#000; }
button:disabled { opacity:0.4; cursor:not-allowed; }
button.primary { border-color:#ff0; color:#ff0; background:rgba(50,50,0,0.5); }
button.primary:hover { background:#ff0; color:#000; }
table { width:100%; border-collapse:collapse; font-size:10px; }
th, td { padding:2px 5px; text-align:left; border-bottom:1px solid #222; }
th { color:#0ff; }
#log { height:160px; overflow-y:auto; background:#000; border:1px solid #333; padding:5px; font-size:10px; line-height:1.4; }
#log .info { color:#0ff; } #log .warn { color:#fa0; } #log .err { color:#f55; } #log .ok { color:#0f0; }
#report-out { width:100%; height:340px; background:#000; color:#0f0; border:1px solid #333; padding:5px; font-family:monospace; font-size:10px; resize:vertical; }
.progress { background:#222; height:8px; border-radius:4px; overflow:hidden; margin-top:6px; }
.progress > div { height:100%; background:#0ff; transition:width 0.1s; }
#validate-result { font-size:10px; color:#0ff; margin-top:6px; max-height:200px; overflow-y:auto; }
</style>

<body>

<h1>CELESTIUM · GA LAB v11 Adaptive</h1>

<div class="grid">
  <div>
    <div class="card">
      <div class="row"><span>상태</span><span id="status">대기</span></div>
      <div class="progress"><div id="progress-bar" style="width:0%"></div></div>
      <div class="row" style="margin-top:6px;"><span>Gen</span><span id="stat-gen">0</span></div>
      <div class="row"><span>Stage</span><span id="stat-stage">S1-5m</span></div>
      <div class="row"><span>Stage best</span><span id="stat-stage-best">-</span></div>
      <div class="row"><span>Final best</span><span id="stat-final-best">-</span></div>
      <div class="row"><span>Avg</span><span id="stat-avg">-</span></div>
    </div>

    <div class="card">
      <button id="btn-start">시작</button>
      <button id="btn-stop" class="danger" disabled>중단</button>
      <button id="btn-reset">초기화</button>
      <button id="btn-validate" class="primary" disabled>DNA 적응성 검증</button>
      <button id="btn-copy">결과 복사</button>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Stage 진행</h2>
      <div id="stage-list" style="font-size:9px; line-height:1.5;"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">결과 리포트</h2>
      <textarea id="report-out" readonly placeholder="완료 후 '결과 복사'"></textarea>
      <div id="validate-result"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2 style="margin-top:0">진단 로그</h2>
      <div id="log"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">세대별 통계</h2>
      <div style="max-height:400px; overflow-y:auto;">
        <table>
          <thead><tr><th>Gen</th><th>Stage</th><th>Best</th><th>Avg</th><th>σ</th><th>L</th><th>C</th><th>F</th><th>T</th></tr></thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ===== 상수 (SI) ===== */
const MOON_R_M = 1737400;
const MOON_MU_M = 4.9028e12;
const G0 = 9.80665;
const SHIP = { dry: 13500, fuel0: 110000, isp: 421, thrustN: 1000000 };
const LANDING_THRESHOLD = 10;

/* ★★ v11: 8 입력, 12 은닉, 1 출력 → DNA_LEN = 108 */
const NN_IN = 8, NN_HID = 12, NN_OUT = 1, DNA_LEN = NN_IN*NN_HID + NN_HID*NN_OUT;

/* ★ 10단계: S1~S9 좁은 범위 → S10 넓은 범위 (adaptive) */
const STAGES = [
  { name:'S1-5m',      altMin:5,    altMax:5,    vrMin:-1,   vrMax:-1,   vtMin:0, vtMax:0,   tMax:15,  maxGens:2,  targetBest:400, wide:false },
  { name:'S2-20m',     altMin:20,   altMax:20,   vrMin:-2,   vrMax:-2,   vtMin:0, vtMax:0,   tMax:25,  maxGens:2,  targetBest:400, wide:false },
  { name:'S3-100m',    altMin:100,  altMax:100,  vrMin:-5,   vrMax:-5,   vtMin:0, vtMax:0,   tMax:40,  maxGens:3,  targetBest:400, wide:false },
  { name:'S4-300m',    altMin:300,  altMax:300,  vrMin:-8,   vrMax:-8,   vtMin:0, vtMax:0,   tMax:50,  maxGens:5,  targetBest:400, wide:false },
  { name:'S5-500m',    altMin:500,  altMax:500,  vrMin:-10,  vrMax:-10,  vtMin:0, vtMax:0,   tMax:70,  maxGens:6,  targetBest:400, wide:false },
  { name:'S6-1km',     altMin:1000, altMax:1000, vrMin:-15,  vrMax:-15,  vtMin:0, vtMax:0,   tMax:90,  maxGens:8,  targetBest:350, wide:false },
  { name:'S7-2km',     altMin:2000, altMax:2000, vrMin:-20,  vrMax:-20,  vtMin:0, vtMax:0,   tMax:120, maxGens:10, targetBest:350, wide:false },
  { name:'S8-5km-V0',  altMin:5000, altMax:5000, vrMin:-50,  vrMax:-50,  vtMin:0, vtMax:0,   tMax:200, maxGens:12, targetBest:350, wide:false },
  { name:'S9-5km-V50', altMin:5000, altMax:5000, vrMin:-100, vrMax:-100, vtMin:50, vtMax:50, tMax:240, maxGens:16, targetBest:500, wide:false },
  { name:'S10-Adaptive', altMin:3000, altMax:7000, vrMin:-80, vrMax:-150, vtMin:0, vtMax:100, tMax:280, maxGens:40, targetBest:800, wide:true },
];

const ADAPT = {
  popSize: 3000,
  eliteCount: 15,
  mutationRate: 0.15,
  baseSigma: 0.4,
  tournamentK: 5,
  injectPct: 0.05,
  seedMutateRate: 0.4,
  seedMutateSigma: 0.25,
  seedBlendRatio: 0.75,
  robustPenalty: 0.4,   // ★ std 페널티 (강건 적합도)
  wideScenarioCount: 5, // ★ wide stage 시나리오 수
};

const ST = {
  population: [], scores: [], gen: 0,
  bestScore: -Infinity, bestDNA: null,
  stageBest: -Infinity, stageBestDNA: null,
  finalStageBest: -Infinity, finalStageDNA: null,
  running: false, history: [],
  currentStage: 0, gensInStage: 0,
};

/* ===== DNA 초기화 ===== */
function makeRandomDNA(){
  const d = new Float32Array(DNA_LEN);
  const isLowThrottle = Math.random() < 0.1;
  const hiddenStart = NN_IN * NN_HID;
  for (let i=0;i<DNA_LEN;i++){
    if (isLowThrottle && i >= hiddenStart){
      d[i] = (Math.random()*2 - 1) * 0.5 - 0.4;
    } else {
      d[i] = (Math.random()*2 - 1) * 0.4;
    }
  }
  return d;
}

/* ===== 신경망 (8→12→1, sigmoid(0.7s-2.5)) ===== */
function forward(dna, x){
  const h = new Float32Array(NN_HID);
  let k = 0;
  for (let j=0;j<NN_HID;j++){
    let s = 0;
    for (let i=0;i<NN_IN;i++) s += x[i] * dna[k++];
    h[j] = Math.tanh(s);
  }
  let s = 0;
  for (let i=0;i<NN_HID;i++) s += h[i] * dna[k++];
  return 1 / (1 + Math.exp(-(s * 0.7 - 2.5)));
}

/* ===== 시뮬레이션 (SI, 물리 기반 입력) ===== */
function simDNA(dna, init, stageIdx){
  const stage = STAGES[stageIdx];
  const altNorm = stage.altMax * 2 + 100;

  let r = init.r, vr = init.vr, vt = init.vt, fuel = init.fuel;
  const dry = SHIP.dry, thrustN = SHIP.thrustN, ve = SHIP.isp * G0;
  const fuel0 = fuel;
  let minAlt = r - MOON_R_M, t = 0;
  const tMax = init.tMax;
  const dt = tMax > 200 ? 0.5 : 0.1;

  while (t < tMax && fuel > 0){
    const alt = r - MOON_R_M;
    if (alt < minAlt) minAlt = alt;
    if (alt <= 0){
      const vT = Math.sqrt(vr*vr + vt*vt);
      return { kind: vT < LANDING_THRESHOLD ? 'L' : 'C', vT, fuelUsed: fuel0 - fuel, t, minAlt: 0 };
    }
    const mass = dry + fuel;
    if (mass <= 0) return { kind: 'C', vT: 999, fuelUsed: fuel0, t, minAlt };
    const gLocal = MOON_MU_M / (r*r);
    const gSurf = MOON_MU_M / (MOON_R_M*MOON_R_M);

    /* ★★ 물리 기반 입력 (핵심) */
    const a_avail = thrustN / mass - gLocal;                       // 최대 감속 (m/s²)
    const a_req = (vr * vr) / (2 * Math.max(1, alt));              // 필요 감속 (m/s²)
    const brake_margin = (a_avail > 0.01) ? Math.min(3, a_req / a_avail) : 3;
    const t_ground = alt / (Math.abs(vr) + 1);                     // 지면 도달 시간 (s)

    const inputs = [
      Math.min(1, alt / altNorm),                                  // 1. 고도
      Math.max(-1, Math.min(1, vr / 150)),                         // 2. 수직속도
      Math.min(1, Math.abs(vt) / 100),                             // 3. 수평속도
      fuel / fuel0,                                                // 4. 연료
      (mass - dry) / fuel0,                                        // 5. 연소량
      Math.min(1, gLocal / gSurf),                                 // 6. 중력
      brake_margin,                                                // 7. ★브레이크 여유
      Math.min(3, t_ground / 30),                                  // 8. ★남은 시간(30s 단위)
    ];
    const throttle = forward(dna, inputs);
    const fuelBurn = thrustN * throttle / ve;

    const vM = Math.sqrt(vr*vr + vt*vt);
    let thR = 0, thT = 0;
    if (vM > 1e-9){
      const thr = thrustN * throttle / mass;
      thR = -vr/vM * thr;
      thT = -vt/vM * thr;
    }
    const deriv = (r_, vr_, vt_, f_) => {
      const m_ = dry + f_;
      if (m_ <= 0) return { dr: vr_, dvr: -MOON_MU_M/(r_*r_), dvt: 0, df: 0 };
      const gR = -MOON_MU_M/(r_*r_), cent = (vt_*vt_)/r_;
      return { dr: vr_, dvr: gR + cent + thR, dvt: -(vr_*vt_)/r_ + thT, df: -fuelBurn };
    };
    const k1 = deriv(r, vr, vt, fuel);
    const k2 = deriv(r + k1.dr*dt/2, vr + k1.dvr*dt/2, vt + k1.dvt*dt/2, fuel + k1.df*dt/2);
    const k3 = deriv(r + k2.dr*dt/2, vr + k2.dvr*dt/2, vt + k2.dvt*dt/2, fuel + k2.df*dt/2);
    const k4 = deriv(r + k3.dr*dt, vr + k3.dvr*dt, vt + k3.dvt*dt, fuel + k3.df*dt);
    r += (k1.dr + 2*k2.dr + 2*k3.dr + k4.dr) * dt / 6;
    vr += (k1.dvr + 2*k2.dvr + 2*k3.dvr + k4.dvr) * dt / 6;
    vt += (k1.dvt + 2*k2.dvt + 2*k3.dvt + k4.dvt) * dt / 6;
    fuel = Math.max(0, fuel + (k1.df + 2*k2.df + 2*k3.df + k4.df) * dt / 6);
    t += dt;
  }
  if (fuel <= 0) return { kind: 'F', vT: 0, fuelUsed: fuel0, t, minAlt };
  return { kind: 'T', vT: 0, fuelUsed: fuel0 - fuel, t, minAlt };
}

/* ===== 시나리오 생성 (wide stage는 랜덤) ===== */
function getScenarios(stageIdx){
  const s = STAGES[stageIdx];
  const n = s.wide ? ADAPT.wideScenarioCount : 3;
  const scenarios = [];
  for (let i=0;i<n;i++){
    let alt, vr, vt, fuel;
    if (s.wide){
      alt = s.altMin + Math.random() * (s.altMax - s.altMin);
      vr = s.vrMin + Math.random() * (s.vrMax - s.vrMin);
      vt = s.vtMin + Math.random() * (s.vtMax - s.vtMin);
      fuel = SHIP.fuel0 * (0.6 + Math.random() * 0.4);
    } else {
      const t = i / Math.max(1, n - 1);
      alt = s.altMin + t * (s.altMax - s.altMin);
      vr = s.vrMin + t * (s.vrMax - s.vrMin);
      vt = s.vtMin + t * (s.vtMax - s.vtMin);
      fuel = SHIP.fuel0 * (i === 0 ? 1.0 : i === 1 ? 0.9 : 0.8);
    }
    scenarios.push({ r: MOON_R_M + alt, vr, vt, fuel, tMax: s.tMax });
  }
  return scenarios;
}

/* ★★ 강건 적합도: mean − 0.4·std */
function evaluate(dna, stageIdx){
  const scenarios = getScenarios(stageIdx);
  const scores = [];
  const stats = { L:0, C:0, F:0, T:0, crashVSum:0, crashCount:0 };

  for (const st of scenarios){
    const res = simDNA(dna, st, stageIdx);
    const initAlt = st.r - MOON_R_M;
    const progress = Math.max(0, Math.min(1, 1 - res.minAlt / Math.max(1, initAlt)));
    const fuelSave = 1 - res.fuelUsed / st.fuel;
    let score;

    if (res.kind === 'L'){
      score = 1500 + fuelSave * 200;
      stats.L++;
    } else if (res.kind === 'C'){
      score = -300 - Math.log10(Math.max(1, res.vT)) * 200 + fuelSave * 50;
      stats.C++; stats.crashVSum += res.vT; stats.crashCount++;
    } else if (res.kind === 'F'){
      score = -1200 + progress * 200;
      stats.F++;
    } else {
      const minAltKm = res.minAlt / 1000;
      score = -1800 + progress * 400 - minAltKm * 50;
      stats.T++;
    }
    scores.push(score);
  }

  const mean = scores.reduce((a,b)=>a+b,0) / scores.length;
  const variance = scores.reduce((s,x)=>s+(x-mean)**2,0) / scores.length;
  const std = Math.sqrt(variance);
  const robust = mean - ADAPT.robustPenalty * std;

  return { score: robust, mean, std, stats };
}

/* ===== GA 연산 ===== */
function tournament(pop, scores, k){
  let bi = Math.floor(Math.random() * pop.length), bs = scores[bi];
  for (let i=0;i<k;i++){
    const idx = Math.floor(Math.random() * pop.length);
    if (scores[idx] > bs){ bs = scores[idx]; bi = idx; }
  }
  return bi;
}
function crossover(a, b){
  const c = new Float32Array(DNA_LEN);
  const cut = Math.floor(Math.random() * DNA_LEN);
  for (let i=0;i<DNA_LEN;i++) c[i] = i < cut ? a[i] : b[i];
  return c;
}
function mutate(d, rate, sigma){
  for (let i=0;i<DNA_LEN;i++){
    if (Math.random() < rate){
      d[i] += (Math.random()*2 - 1) * sigma;
      if (d[i] > 2) d[i] = 2;
      if (d[i] < -2) d[i] = -2;
    }
  }
}

/* ===== UI ===== */
function el(id){ return document.getElementById(id); }
function log(text, type='info'){
  const d = document.createElement('div');
  d.className = type;
  const t = new Date();
  d.textContent = `[${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}] ${text}`;
  el('log').appendChild(d);
  el('log').scrollTop = el('log').scrollHeight;
}

function updateStageList(){
  let html = '';
  for (let i=0;i<STAGES.length;i++){
    const s = STAGES[i];
    const marker = i < ST.currentStage ? '✓' : (i === ST.currentStage ? '▶' : '○');
    const color = i < ST.currentStage ? '#0f0' : (i === ST.currentStage ? '#0ff' : '#666');
    const rangeLabel = s.wide ? `alt ${s.altMin/1000}-${s.altMax/1000}km 랜덤` : `alt=${s.altMin}m`;
    html += `<div style="color:${color};"><b>${marker} ${s.name}</b>: ${rangeLabel}${s.wide?' ★':''}</div>`;
  }
  el('stage-list').innerHTML = html;
}

async function runGeneration(){
  const gen = ST.gen;
  const stageIdx = ST.currentStage;
  const stage = STAGES[stageIdx];

  const aggStats = { L:0, C:0, F:0, T:0 };
  const scores = new Array(ADAPT.popSize);
  const stds = new Array(ADAPT.popSize);

  for (let i=0;i<ADAPT.popSize;i++){
    if (!ST.running) return false;
    const ev = evaluate(ST.population[i], stageIdx);
    scores[i] = ev.score;
    stds[i] = ev.std;
    aggStats.L += ev.stats.L; aggStats.C += ev.stats.C;
    aggStats.F += ev.stats.F; aggStats.T += ev.stats.T;

    if (i % 50 === 0){
      el('progress-bar').style.width = ((i/ADAPT.popSize)*100).toFixed(1) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }

  ST.scores = scores;
  let bi = 0;
  for (let i=1;i<scores.length;i++) if (scores[i] > scores[bi]) bi = i;
  const genBest = scores[bi];

  if (genBest > ST.bestScore){ ST.bestScore = genBest; ST.bestDNA = ST.population[bi].slice(); }
  if (genBest > ST.stageBest){ ST.stageBest = genBest; ST.stageBestDNA = ST.population[bi].slice(); }

  const isFinal = (stageIdx === STAGES.length - 1);
  if (isFinal && genBest > ST.finalStageBest){
    ST.finalStageBest = genBest;
    ST.finalStageDNA = ST.population[bi].slice();
  }

  const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
  const avgStd = stds.reduce((a,b)=>a+b,0) / stds.length;

  const tr = document.createElement('tr');
  const lColor = aggStats.L > 0 ? '#0f0' : '#444';
  tr.innerHTML = `<td>${gen+1}</td><td>${stage.name}</td>
    <td>${genBest.toFixed(0)}</td><td>${avg.toFixed(0)}</td><td>${avgStd.toFixed(0)}</td>
    <td style="color:${lColor}; font-weight:bold;">${aggStats.L}</td>
    <td style="color:#f55;">${aggStats.C}</td>
    <td style="color:#fa0;">${aggStats.F}</td>
    <td style="color:#88f;">${aggStats.T}</td>`;
  el('stats-body').appendChild(tr);
  el('stats-body').parentElement.parentElement.scrollTop = 9999;

  el('stat-gen').textContent = gen+1;
  el('stat-stage').textContent = stage.name;
  el('stat-stage-best').textContent = ST.stageBest.toFixed(0);
  el('stat-final-best').textContent = ST.finalStageDNA ? ST.finalStageBest.toFixed(0) : '-';
  el('stat-avg').textContent = avg.toFixed(0);
  updateStageList();

  ST.history.push({ gen, stage: stageIdx, best: genBest, avg, std: avgStd, stats: aggStats });
  ST.gensInStage++;

  const targetReached = ST.stageBest >= stage.targetBest;
  const maxReached = ST.gensInStage >= stage.maxGens;
  let stageAdvanced = false, terminated = false;

  if (targetReached && ST.gensInStage >= 2 && stageIdx < STAGES.length - 1){
    stageAdvanced = true;
    log(`★ ${stage.name} → ${STAGES[stageIdx+1].name} (target=${ST.stageBest.toFixed(0)})`, 'ok');
  } else if (maxReached){
    if (stageIdx < STAGES.length - 1){
      stageAdvanced = true;
      log(`→ ${stage.name} → ${STAGES[stageIdx+1].name} (maxGens, best=${ST.stageBest.toFixed(0)})`, 'warn');
    } else {
      terminated = true;
      log(`■ 최종 stage 완료 (best=${ST.stageBest.toFixed(0)})`, 'ok');
    }
  }

  if (stageAdvanced){
    const seedDNA = ST.stageBestDNA ? ST.stageBestDNA.slice() : null;
    ST.currentStage++;
    ST.gensInStage = 0;
    ST.stageBest = -Infinity;
    ST.stageBestDNA = null;

    const newPop = [];
    if (seedDNA){
      newPop.push(seedDNA);
      const blendCount = Math.floor(ADAPT.popSize * ADAPT.seedBlendRatio);
      while (newPop.length < 1 + blendCount){
        const d = seedDNA.slice();
        mutate(d, ADAPT.seedMutateRate, ADAPT.seedMutateSigma);
        newPop.push(d);
      }
    }
    while (newPop.length < ADAPT.popSize) newPop.push(makeRandomDNA());
    ST.population = newPop;
  } else {
    const sorted = scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
    const next = [];
    for (let e=0;e<ADAPT.eliteCount && e<sorted.length;e++) next.push(ST.population[sorted[e].i].slice());

    const injectCount = Math.floor(ADAPT.popSize * ADAPT.injectPct);
    const targetFill = ADAPT.popSize - injectCount;
    const sigma = Math.max(0.08, ADAPT.baseSigma * Math.exp(-ST.gen/60));

    while (next.length < targetFill){
      const a = tournament(ST.population, scores, ADAPT.tournamentK);
      const b = tournament(ST.population, scores, ADAPT.tournamentK);
      const c = crossover(ST.population[a], ST.population[b]);
      mutate(c, ADAPT.mutationRate, sigma);
      next.push(c);
    }
    while (next.length < ADAPT.popSize) next.push(makeRandomDNA());
    ST.population = next;
  }

  ST.gen++;
  if (terminated) return false;
  return true;
}

async function start(){
  if (ST.running) return;
  ST.running = true;
  el('btn-start').disabled = true;
  el('btn-stop').disabled = false;
  el('btn-validate').disabled = true;
  el('status').textContent = '학습 중...';
  log(`v11 학습 시작 (pop=${ADAPT.popSize}, 8→12→1, ${STAGES.length} stages)`, 'info');

  let safety = 500;
  while (ST.running && safety-- > 0){
    const cont = await runGeneration();
    if (!cont) break;
    await new Promise(r => setTimeout(r, 0));
  }

  ST.running = false;
  el('btn-start').disabled = false;
  el('btn-stop').disabled = true;
  el('status').textContent = '완료';
  el('progress-bar').style.width = '100%';

  if (ST.finalStageDNA) el('btn-validate').disabled = false;

  generateReport();
  log(`완료. final best=${ST.finalStageBest.toFixed(0)}`, 'ok');
}

/* ★★ DNA 적응성 검증: 30 랜덤 시나리오 */
function validateFinalDNA(){
  if (!ST.finalStageDNA){ log('최종 DNA 없음', 'warn'); return; }
  const dna = ST.finalStageDNA;
  let L=0, C=0, F=0, T=0;
  const rows = [];
  for (let i=0;i<30;i++){
    const alt = 3000 + Math.random()*4000;
    const vr = -50 - Math.random()*100;
    const vt = Math.random()*100;
    const fuel = SHIP.fuel0 * (0.5 + Math.random()*0.5);
    const st = { r: MOON_R_M + alt, vr, vt, fuel, tMax: 280 };
    const res = simDNA(dna, st, STAGES.length - 1);
    if (res.kind === 'L') L++;
    else if (res.kind === 'C') C++;
    else if (res.kind === 'F') F++;
    else T++;
    rows.push({ alt: alt.toFixed(0), vr: vr.toFixed(0), vt: vt.toFixed(0), fuel: (fuel/SHIP.fuel0*100).toFixed(0), kind: res.kind, vT: res.vT?.toFixed(0) });
  }
  const successRate = (L / 30 * 100).toFixed(0);
  let html = `<div style="color:${L>=24?'#0f0':L>=18?'#fa0':'#f55'}; font-weight:bold; font-size:12px;">
    적응성: L=${L}/30 (${successRate}%) | C:${C} F:${F} T:${T}</div>`;
  html += `<table style="margin-top:4px;"><tr><th>alt</th><th>vr</th><th>vt</th><th>fuel%</th><th>결과</th></tr>`;
  rows.forEach(r => {
    const color = r.kind === 'L' ? '#0f0' : r.kind === 'C' ? '#f55' : r.kind === 'F' ? '#fa0' : '#88f';
    html += `<tr style="color:${color}"><td>${r.alt}m</td><td>${r.vr}</td><td>${r.vt}</td><td>${r.fuel}%</td><td>${r.kind}${r.kind==='C'?' v='+r.vT:''}</td></tr>`;
  });
  html += `</table>`;
  el('validate-result').innerHTML = html;
  log(`검증: L=${L}/30 (${successRate}%)`, L>=24?'ok':'warn');
}

function generateReport(){
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const lastStage = STAGES[STAGES.length-1];
  const altNorm = lastStage.altMax * 2 + 100;

  let r = `=== CELESTIUM GA LAB v11 Adaptive 리포트 ===\n`;
  r += `시각: ${timeStr}\nPop: ${ADAPT.popSize} | Total Gens: ${ST.gen}\n`;
  r += `Landing: v < ${LANDING_THRESHOLD} m/s | Units: SI\n\n`;

  r += `=== ★ 최종 DNA (Adaptive) ===\n`;
  r += `Final score: ${ST.finalStageBest.toFixed(2)}\n`;
  r += `Arch: [8, 12, 1] | DNA_LEN: 108\n`;
  r += `Activation: sigmoid(0.7s - 2.5)\n`;
  r += `Norm: alt/${altNorm}, vr/150, vt/100 + physics-informed\n\n`;

  r += `=== 입력 계약 (8개, 순서 중요) ===\n`;
  r += `1. alt/${altNorm}  (m)\n`;
  r += `2. vr/150  (m/s)\n`;
  r += `3. |vt|/100  (m/s)\n`;
  r += `4. fuel/fuel0\n`;
  r += `5. (mass-dry)/fuel0\n`;
  r += `6. gLocal/gSurf\n`;
  r += `7. brake_margin = (vr²/2·alt) / (thrust/mass - gLocal)  [0~3 clamp]\n`;
  r += `8. t_ground/30 = (alt/(|vr|+1))/30  [0~3 clamp]\n\n`;

  r += `=== DNA (JSON) ===\n`;
  r += JSON.stringify({
    dna: Array.from(ST.finalStageDNA || ST.stageBestDNA || []),
    score: ST.finalStageBest,
    arch: [NN_IN, NN_HID, NN_OUT],
    activation: 'sigmoid(0.7s - 2.5)',
    norm: { altRef: altNorm, vrRef: 150, vtRef: 100, physicsInputs: true },
    units: 'SI',
    adaptive: true,
    trainedRanges: { alt: '3000-7000m', vr: '-80~-150m/s', vt: '0-100m/s', fuel: '60-100%' },
  });
  r += `\n\n`;

  r += `=== Stage별 최고 best ===\n`;
  let lastIdx = -1, stageMax = -Infinity, stageGens = 0, stageL = 0;
  for (const h of ST.history){
    if (h.stage !== lastIdx){
      if (lastIdx >= 0) r += `  ${STAGES[lastIdx].name}: max=${stageMax.toFixed(0)} L=${stageL} (${stageGens}g)\n`;
      lastIdx = h.stage; stageMax = -Infinity; stageGens = 0; stageL = 0;
    }
    if (h.best > stageMax) stageMax = h.best;
    stageL += h.stats.L;
    stageGens++;
  }
  if (lastIdx >= 0) r += `  ${STAGES[lastIdx].name}: max=${stageMax.toFixed(0)} L=${stageL} (${stageGens}g)\n`;

  el('report-out').value = r;
}

function stop(){ ST.running = false; el('status').textContent = '중단됨'; log('중단', 'warn'); }

function reset(){
  ST.population = []; ST.scores = []; ST.gen = 0;
  ST.bestDNA = null; ST.bestScore = -Infinity;
  ST.stageBest = -Infinity; ST.stageBestDNA = null;
  ST.finalStageBest = -Infinity; ST.finalStageDNA = null;
  ST.running = false; ST.history = [];
  ST.currentStage = 0; ST.gensInStage = 0;
  for (let i=0;i<ADAPT.popSize;i++) ST.population.push(makeRandomDNA());
  el('log').innerHTML = ''; el('stats-body').innerHTML = ''; el('report-out').value = '';
  el('validate-result').innerHTML = '';
  el('progress-bar').style.width = '0%';
  el('stat-gen').textContent = '0';
  el('stat-stage').textContent = STAGES[0].name;
  el('stat-stage-best').textContent = '-';
  el('stat-final-best').textContent = '-';
  el('stat-avg').textContent = '-';
  el('status').textContent = '대기';
  el('btn-start').disabled = false;
  el('btn-stop').disabled = true;
  el('btn-validate').disabled = true;
  updateStageList();
  log('초기화 v11: 8→12→1, 물리 입력, 도메인 랜덤화, robust fitness', 'info');
}

function copyReport(){
  const ta = el('report-out');
  if (!ta.value){ log('리포트 없음', 'warn'); return; }
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(
      () => log('복사됨', 'ok'),
      () => { document.execCommand('copy'); log('복사됨', 'ok'); }
    );
  } catch(e){ document.execCommand('copy'); log('복사됨', 'ok'); }
}

el('btn-start').addEventListener('click', start);
el('btn-stop').addEventListener('click', stop);
el('btn-reset').addEventListener('click', reset);
el('btn-copy').addEventListener('click', copyReport);
el('btn-validate').addEventListener('click', validateFinalDNA);
reset();
</script>
