<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CELESTIUM GA Lab v4</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:monospace; }
body { background:#050505; color:#ccc; padding:12px; font-size:12px; }
h1 { color:#0ff; font-size:15px; margin-bottom:6px; letter-spacing:2px; }
h2 { color:#0f0; font-size:12px; margin:12px 0 4px; border-bottom:1px solid #333; padding-bottom:3px; }
.grid { display:grid; grid-template-columns: 320px 1fr; gap:12px; }
.card { background:#111; border:1px solid #333; padding:8px; border-radius:4px; margin-bottom:8px; }
.row { display:flex; justify-content:space-between; padding:2px 0; }
.row span:last-child { color:#ff0; font-weight:bold; }
button { background:#003; border:1px solid #0ff; color:#0ff; padding:6px 10px; cursor:pointer; font-family:monospace; font-size:11px; margin:2px; }
button:hover { background:#0ff; color:#000; }
button.danger { border-color:#f55; color:#f55; }
button.danger:hover { background:#f55; color:#000; }
button:disabled { opacity:0.4; cursor:not-allowed; }
table { width:100%; border-collapse:collapse; font-size:10px; }
th, td { padding:2px 5px; text-align:left; border-bottom:1px solid #222; }
th { color:#0ff; }
.case-A { color:#f55; } .case-B { color:#fa0; } .case-C { color:#f55; }
.case-D { color:#fa0; } .case-E { color:#0f0; } .case-F { color:#88f; }
#log { height:140px; overflow-y:auto; background:#000; border:1px solid #333; padding:5px; font-size:10px; line-height:1.4; }
#log .info { color:#0ff; } #log .warn { color:#fa0; } #log .err { color:#f55; } #log .ok { color:#0f0; }
#report-out { width:100%; height:240px; background:#000; color:#0f0; border:1px solid #333; padding:5px; font-family:monospace; font-size:10px; resize:vertical; }
.progress { background:#222; height:8px; border-radius:4px; overflow:hidden; margin-top:6px; }
.progress > div { height:100%; background:#0ff; transition:width 0.1s; }
</style>
</head>
<body>

<h1>CELESTIUM · GA LAB v4</h1>

<div class="grid">
  <div>
    <div class="card">
      <div class="row"><span>상태</span><span id="status">대기</span></div>
      <div class="progress"><div id="progress-bar" style="width:0%"></div></div>
      <div class="row" style="margin-top:6px;"><span>Gen</span><span id="stat-gen">0 / 40</span></div>
      <div class="row"><span>Stage</span><span id="stat-stage">S1</span></div>
      <div class="row"><span>Best</span><span id="stat-best">-</span></div>
      <div class="row"><span>Avg</span><span id="stat-avg">-</span></div>
    </div>

    <div class="card">
      <button id="btn-start">시작</button>
      <button id="btn-stop" class="danger" disabled>중단</button>
      <button id="btn-reset">초기화</button>
      <button id="btn-copy">결과 복사</button>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Stage 진행 상태</h2>
      <div id="stage-list" style="font-size:10px; line-height:1.6;"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">결과 리포트 (복사용)</h2>
      <textarea id="report-out" readonly placeholder="완료 후 '결과 복사' 버튼"></textarea>
    </div>
  </div>

  <div>
    <div class="card">
      <h2 style="margin-top:0">진단 로그</h2>
      <div id="log"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">세대별 통계</h2>
      <div style="max-height:400px; overflow-y:auto;">
        <table>
          <thead><tr><th>Gen</th><th>Stage</th><th>Best</th><th>Avg</th><th>L</th><th>C</th><th>F</th><th>T</th><th>조정</th></tr></thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const MOON_R = 1737.4, MOON_MU = 4902.8, G0 = 9.80665;
const SHIP = { dry: 13500, fuel0: 110000, isp: 421, thrustKN: 1000 };
const NN_IN = 6, NN_HID = 12, NN_OUT = 1, DNA_LEN = NN_IN*NN_HID + NN_HID*NN_OUT;

/* ★ 7단계 커리큘럼: 진짜 쉬운 것부터, targetBest 도달 시 조기 진행 */
const STAGES = [
  { name:'S1-Tiny',      altMin:100,   altMax:200,   vtMax:0,    vrMin:-5,  vrMax:-10,  tMax:60,  maxGens:3,  targetBest:500 },
  { name:'S2-Small',     altMin:500,   altMax:1000,  vtMax:0,    vrMin:-10, vrMax:-20,  tMax:120, maxGens:4,  targetBest:500 },
  { name:'S3-Vert',      altMin:3000,  altMax:5000,  vtMax:0,    vrMin:-20, vrMax:-30,  tMax:180, maxGens:4,  targetBest:500 },
  { name:'S4-DeepVert',  altMin:10000, altMax:10000, vtMax:0,    vrMin:-30, vrMax:-35,  tMax:240, maxGens:5,  targetBest:500 },
  { name:'S5-Horiz200',  altMin:15000, altMax:15000, vtMax:200,  vrMin:-30, vrMax:-35,  tMax:300, maxGens:6,  targetBest:600 },
  { name:'S6-Horiz800',  altMin:15000, altMax:15000, vtMax:800,  vrMin:-30, vrMax:-35,  tMax:400, maxGens:6,  targetBest:700 },
  { name:'S7-FullPDI',   altMin:15000, altMax:15000, vtMax:1700, vrMin:-30, vrMax:-35,  tMax:600, maxGens:12, targetBest:800 },
];

const ADAPT = {
  popSize: 2000,
  eliteCount: 6,
  mutationRate: 0.15,
  baseSigma: 0.35,
  tournamentK: 5,
  injectPct: 0.05,
};

const ST = {
  population: [], scores: [], gen: 0,
  bestDNA: null, bestScore: -Infinity,
  running: false, history: [],
  currentStage: 0, gensInStage: 0,
  stageBest: -Infinity,
};

/* Xavier 근사 초기화 */
function makeRandomDNA(){
  const d = new Float32Array(DNA_LEN);
  const scale = 0.4;
  for (let i=0;i<DNA_LEN;i++) d[i] = (Math.random()*2 - 1) * scale;
  return d;
}

/* ★ 출력 활성화: sigmoid(0.7s - 1.0) → 초기 0.27, 호버 회피 */
function forward(dna, x){
  const h = new Float32Array(NN_HID);
  let k = 0;
  for (let j=0;j<NN_HID;j++){
    let s = 0;
    for (let i=0;i<NN_IN;i++) s += x[i] * dna[k++];
    h[j] = Math.tanh(s);
  }
  let s = 0;
  for (let i=0;i<NN_HID;i++) s += h[i] * dna[k++];
  return 1 / (1 + Math.exp(-(s * 0.7 - 1.0)));
}

function simDNA(dna, init){
  let r = init.r, vr = init.vr, vt = init.vt, fuel = init.fuel;
  const dry = SHIP.dry, thrustN = SHIP.thrustKN * 1000, isp = SHIP.isp;
  const fuel0 = fuel;
  let minAlt = r - MOON_R, t = 0;
  const tMax = init.tMax;
  const dt = tMax > 300 ? 1.0 : 0.5;

  while (t < tMax && fuel > 0){
    const alt = r - MOON_R;
    if (alt < minAlt) minAlt = alt;
    if (alt <= 0){
      const vT = Math.sqrt(vr*vr + vt*vt) * 1000;
      return { kind: vT < 3 ? 'L' : 'C', vT, fuelUsed: fuel0 - fuel, t, minAlt: 0 };
    }
    const mass = dry + fuel;
    if (mass <= 0) return { kind: 'C', vT: 999, fuelUsed: fuel0, t, minAlt };
    const gLocal = MOON_MU / (r*r), gSurf = MOON_MU / (MOON_R*MOON_R);

    const inputs = [
      Math.min(1, alt / 15000),
      Math.max(-1, Math.min(1, vr / 100)),
      Math.min(1, Math.abs(vt) / 1700),
      fuel / fuel0,
      (mass - dry) / fuel0,
      Math.min(1, gLocal / gSurf),
    ];
    const throttle = forward(dna, inputs);
    const fuelBurn = (thrustN * throttle / (isp * G0)) / 1000;

    const vM = Math.sqrt(vr*vr + vt*vt);
    let thR = 0, thT = 0;
    if (vM > 1e-9){
      const thr = (thrustN * throttle / mass) / 1000;
      thR = -vr/vM * thr;
      thT = -vt/vM * thr;
    }
    const deriv = (r_, vr_, vt_, f_) => {
      const m_ = dry + f_;
      if (m_ <= 0) return { dr: vr_, dvr: -MOON_MU/(r_*r_), dvt: 0, df: 0 };
      const gR = -MOON_MU/(r_*r_), cent = (vt_*vt_)/r_;
      return { dr: vr_, dvr: gR + cent + thR, dvt: -(vr_*vt_)/r_ + thT, df: -fuelBurn };
    };
    const k1 = deriv(r, vr, vt, fuel);
    const k2 = deriv(r + k1.dr*dt/2, vr + k1.dvr*dt/2, vt + k1.dvt*dt/2, fuel + k1.df*dt/2);
    const k3 = deriv(r + k2.dr*dt/2, vr + k2.dvr*dt/2, vt + k2.dvt*dt/2, fuel + k2.df*dt/2);
    const k4 = deriv(r + k3.dr*dt, vr + k3.dvr*dt, vt + k3.dvt*dt, fuel + k3.df*dt);
    r += (k1.dr + 2*k2.dr + 2*k3.dr + k4.dr) * dt / 6;
    vr += (k1.dvr + 2*k2.dvr + 2*k3.dvr + k4.dvr) * dt / 6;
    vt += (k1.dvt + 2*k2.dvt + 2*k3.dvt + k4.dvt) * dt / 6;
    fuel = Math.max(0, fuel + (k1.df + 2*k2.df + 2*k3.df + k4.df) * dt / 6);
    t += dt;
  }
  if (fuel <= 0) return { kind: 'F', vT: 0, fuelUsed: fuel0, t, minAlt };
  return { kind: 'T', vT: 0, fuelUsed: fuel0 - fuel, t, minAlt };
}

function getScenarios(stageIdx){
  const s = STAGES[stageIdx];
  const interp = (a, b) => a + (b-a) * Math.random();
  return [
    { r: MOON_R + interp(s.altMin, s.altMax), vr: interp(s.vrMin, s.vrMax), vt: 0, fuel: SHIP.fuel0, tMax: s.tMax },
    { r: MOON_R + interp(s.altMin, s.altMax), vr: interp(s.vrMin, s.vrMax), vt: s.vtMax * 0.5, fuel: SHIP.fuel0 * 0.9, tMax: s.tMax },
    { r: MOON_R + interp(s.altMin, s.altMax), vr: interp(s.vrMin, s.vrMax), vt: s.vtMax, fuel: SHIP.fuel0 * 0.8, tMax: s.tMax },
  ];
}

function evaluate(dna, stageIdx){
  const scenarios = getScenarios(stageIdx);
  const stats = { L:0, C:0, F:0, T:0, crashVSum:0, crashCount:0 };
  let total = 0;
  for (const st of scenarios){
    const res = simDNA(dna, st);
    const initAlt = st.r - MOON_R;
    const progress = Math.max(0, Math.min(1, 1 - res.minAlt / Math.max(1, initAlt)));
    const fuelSave = 1 - res.fuelUsed / st.fuel;
    let score;
    if (res.kind === 'L'){
      score = 1000 + fuelSave * 500;
      stats.L++;
    } else if (res.kind === 'C'){
      score = -500 + progress * 1000 + fuelSave * 200;
      stats.C++; stats.crashVSum += res.vT; stats.crashCount++;
    } else if (res.kind === 'F'){
      score = -1000 + progress * 800;
      stats.F++;
    } else {
      score = -2000 + progress * 1500;  // ★ T를 최악으로
      stats.T++;
    }
    total += score;
  }
  return { score: total / scenarios.length, stats };
}

function tournament(pop, scores, k){
  let bi = Math.floor(Math.random() * pop.length), bs = scores[bi];
  for (let i=0;i<k;i++){
    const idx = Math.floor(Math.random() * pop.length);
    if (scores[idx] > bs){ bs = scores[idx]; bi = idx; }
  }
  return bi;
}
function crossover(a, b){
  const c = new Float32Array(DNA_LEN);
  const cut = Math.floor(Math.random() * DNA_LEN);
  for (let i=0;i<DNA_LEN;i++) c[i] = i < cut ? a[i] : b[i];
  return c;
}
function mutate(d, rate, sigma){
  for (let i=0;i<DNA_LEN;i++){
    if (Math.random() < rate){
      d[i] += (Math.random()*2 - 1) * sigma;
      if (d[i] > 2) d[i] = 2;
      if (d[i] < -2) d[i] = -2;
    }
  }
}

function el(id){ return document.getElementById(id); }
function log(text, type='info'){
  const d = document.createElement('div');
  d.className = type;
  const t = new Date();
  d.textContent = `[${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}] ${text}`;
  el('log').appendChild(d);
  el('log').scrollTop = el('log').scrollHeight;
}

function updateStageList(){
  let html = '';
  for (let i=0;i<STAGES.length;i++){
    const s = STAGES[i];
    const marker = i < ST.currentStage ? '✓' : (i === ST.currentStage ? '▶' : '○');
    const color = i < ST.currentStage ? '#0f0' : (i === ST.currentStage ? '#0ff' : '#666');
    html += `<div style="color:${color};"><b>${marker} ${s.name}</b>: ${s.altMin/1000}-${s.altMax/1000}km, vt≤${s.vtMax}, tMax=${s.tMax}s</div>`;
  }
  el('stage-list').innerHTML = html;
}

async function runGeneration(){
  const gen = ST.gen;
  const stageIdx = ST.currentStage;
  const stage = STAGES[stageIdx];

  const aggStats = { L:0, C:0, F:0, T:0, crashVSum:0, crashCount:0 };
  const scores = new Array(ADAPT.popSize);

  for (let i=0;i<ADAPT.popSize;i++){
    if (!ST.running) return false;
    const { score, stats } = evaluate(ST.population[i], stageIdx);
    scores[i] = score;
    aggStats.L += stats.L; aggStats.C += stats.C;
    aggStats.F += stats.F; aggStats.T += stats.T;
    aggStats.crashVSum += stats.crashVSum; aggStats.crashCount += stats.crashCount;

    if (i % 50 === 0){
      el('progress-bar').style.width = ((i/ADAPT.popSize)*100).toFixed(1) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }

  ST.scores = scores;
  let bi = 0;
  for (let i=1;i<scores.length;i++) if (scores[i] > scores[bi]) bi = i;
  const genBest = scores[bi];
  if (genBest > ST.bestScore){ ST.bestScore = genBest; ST.bestDNA = ST.population[bi].slice(); }
  if (genBest > ST.stageBest) ST.stageBest = genBest;

  const avg = scores.reduce((a,b)=>a+b,0) / scores.length;

  /* 통계 표 */
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${gen+1}</td><td>${stage.name}</td>
    <td>${genBest.toFixed(0)}</td><td>${avg.toFixed(0)}</td>
    <td>${aggStats.L}</td><td>${aggStats.C}</td><td>${aggStats.F}</td><td>${aggStats.T}</td>
    <td style="font-size:9px;">-</td>`;
  el('stats-body').appendChild(tr);
  el('stats-body').parentElement.parentElement.scrollTop = 9999;

  el('stat-gen').textContent = (gen+1) + ' / ?';
  el('stat-stage').textContent = stage.name;
  el('stat-best').textContent = ST.bestScore.toFixed(0);
  el('stat-avg').textContent = avg.toFixed(0);
  updateStageList();

  ST.history.push({ gen, stage: stageIdx, best: genBest, avg, stats: aggStats });
  ST.gensInStage++;

  /* ★ Stage 진행 판단 */
  const targetReached = ST.stageBest >= stage.targetBest;
  const maxReached = ST.gensInStage >= stage.maxGens;
  let stageAdvanced = false;

  if (targetReached && ST.gensInStage >= 2){
    stageAdvanced = true;
    log(`★ Stage ${stage.name} → ${STAGES[stageIdx+1]?.name || 'END'} (target 도달, best=${ST.stageBest.toFixed(0)})`, 'ok');
  } else if (maxReached && stageIdx < STAGES.length - 1){
    stageAdvanced = true;
    log(`→ Stage ${stage.name} → ${STAGES[stageIdx+1]?.name} (최대 세대, best=${ST.stageBest.toFixed(0)})`, 'warn');
  }

  if (stageAdvanced && stageIdx < STAGES.length - 1){
    ST.currentStage++;
    ST.gensInStage = 0;
    ST.stageBest = -Infinity;
  }

  /* 다음 세대 생성 */
  const sorted = scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
  const next = [];
  for (let e=0;e<ADAPT.eliteCount && e<sorted.length;e++) next.push(ST.population[sorted[e].i].slice());

  /* 매 세대 5% 랜덤 주입 */
  const injectCount = Math.floor(ADAPT.popSize * ADAPT.injectPct);
  const targetFill = ADAPT.popSize - injectCount;

  const sigma = Math.max(0.08, ADAPT.baseSigma * Math.exp(-ST.gen/(STAGES.length * STAGES[0].maxGens)));
  while (next.length < targetFill){
    const a = tournament(ST.population, scores, ADAPT.tournamentK);
    const b = tournament(ST.population, scores, ADAPT.tournamentK);
    const c = crossover(ST.population[a], ST.population[b]);
    mutate(c, ADAPT.mutationRate, sigma);
    next.push(c);
  }
  while (next.length < ADAPT.popSize) next.push(makeRandomDNA());

  ST.population = next;
  ST.gen++;

  /* 종료 조건: 마지막 stage 완료 */
  if (ST.currentStage >= STAGES.length) return false;
  return true;
}

async function start(){
  if (ST.running) return;
  ST.running = true;
  el('btn-start').disabled = true;
  el('btn-stop').disabled = false;
  el('status').textContent = '학습 중...';
  log(`학습 시작 (pop=${ADAPT.popSize}, stages=${STAGES.length})`, 'info');

  while (ST.running){
    const cont = await runGeneration();
    if (!cont) break;
    await new Promise(r => setTimeout(r, 0));
  }

  ST.running = false;
  el('btn-start').disabled = false;
  el('btn-stop').disabled = true;
  el('status').textContent = '완료';
  el('progress-bar').style.width = '100%';

  generateReport();
  log(`완료. Best=${ST.bestScore.toFixed(0)}. '결과 복사' 클릭`, 'ok');
}

function generateReport(){
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  let r = `=== CELESTIUM GA LAB v4 리포트 ===\n`;
  r += `시각: ${timeStr}\n`;
  r += `Best: ${ST.bestScore.toFixed(2)} | Pop: ${ADAPT.popSize} | Total Gens: ${ST.gen}\n`;
  r += `Final Stage: ${STAGES[Math.min(ST.currentStage, STAGES.length-1)].name}\n\n`;
  
  r += `=== Stage별 최고 best ===\n`;
  let lastStage = -1, stageMax = -Infinity;
  for (const h of ST.history){
    if (h.stage !== lastStage){
      if (lastStage >= 0) r += `  ${STAGES[lastStage].name}: stageMax=${stageMax.toFixed(0)}\n`;
      lastStage = h.stage; stageMax = -Infinity;
    }
    if (h.best > stageMax) stageMax = h.best;
  }
  if (lastStage >= 0) r += `  ${STAGES[lastStage].name}: stageMax=${stageMax.toFixed(0)}\n`;
  r += `\n`;
  
  r += `=== 세대별 상세 (L=C착륙 C=충돌 F=연료 T=타임아웃) ===\n`;
  ST.history.forEach(h => {
    const st = h.stats;
    r += `Gen ${h.gen+1} [${STAGES[h.stage].name}]: best=${h.best.toFixed(0)} avg=${h.avg.toFixed(0)} | L:${st.L} C:${st.C} F:${st.F} T:${st.T}\n`;
  });
  
  r += `\n=== DNA (JSON) ===\n`;
  r += JSON.stringify({
    dna: Array.from(ST.bestDNA || []),
    score: ST.bestScore,
    arch: [NN_IN, NN_HID, NN_OUT],
    norm: { alt: 15000, vr: 100, vt: 1700, fuel: SHIP.fuel0 },
    activation: 'sigmoid(0.7s - 1.0)',
    finalStage: ST.currentStage,
  });
  r += `\n=== END ===`;
  
  el('report-out').value = r;
}

function stop(){ ST.running = false; el('status').textContent = '중단됨'; log('중단', 'warn'); }

function reset(){
  ST.population = []; ST.scores = []; ST.gen = 0;
  ST.bestDNA = null; ST.bestScore = -Infinity;
  ST.running = false; ST.history = [];
  ST.currentStage = 0; ST.gensInStage = 0; ST.stageBest = -Infinity;
  ADAPT.baseSigma = 0.35;
  for (let i=0;i<ADAPT.popSize;i++) ST.population.push(makeRandomDNA());
  el('log').innerHTML = ''; el('stats-body').innerHTML = ''; el('report-out').value = '';
  el('progress-bar').style.width = '0%';
  el('stat-gen').textContent = '0 / ?';
  el('stat-stage').textContent = STAGES[0].name;
  el('stat-best').textContent = '-'; el('stat-avg').textContent = '-';
  el('status').textContent = '대기';
  el('btn-start').disabled = false; el('btn-stop').disabled = true;
  updateStageList();
  log('초기화 (Xavier scale 0.4, sigmoid(0.7s-1.0))', 'info');
}

function copyReport(){
  const ta = el('report-out');
  if (!ta.value){ log('리포트 없음', 'warn'); return; }
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(
      () => log('복사됨', 'ok'),
      () => { document.execCommand('copy'); log('복사됨', 'ok'); }
    );
  } catch(e){ document.execCommand('copy'); log('복사됨', 'ok'); }
}

el('btn-start').addEventListener('click', start);
el('btn-stop').addEventListener('click', stop);
el('btn-reset').addEventListener('click', reset);
el('btn-copy').addEventListener('click', copyReport);
reset();
</script>
</body>
</html>
